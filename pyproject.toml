[project]
name = "lastwar-bot"
version = "0.1.0"
description = "Last War PC automation bot with pluggable local/cloud AI vision"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Carono" }]
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
