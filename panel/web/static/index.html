<!doctype html>
<!--
  The page the phone opens. NOT ONE WORD OF IT IS WRITTEN HERE: every readable string is
  a `data-i18n` key, filled in from /api/i18n — the panel's own locale table — so the
  remote control speaks whatever language the panel is set to and a new key reaches both
  front-ends at once (CLAUDE.md, «Not one word of the panel is written in the panel»).
  The title is set by the script for the same reason.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#12161d">
<title></title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- the token box, shown until the server says the cookie is good -->
<section id="login" class="gate" hidden>
  <h1 data-i18n="web.ui.title"></h1>
  <p class="muted" data-i18n="web.ui.login.hint"></p>
  <input id="login-token" type="password" autocomplete="off" autocapitalize="off"
         spellcheck="false" data-i18n-placeholder="web.ui.login.token">
  <button id="login-go" data-i18n="web.ui.login.enter"></button>
  <p id="login-bad" class="bad" data-i18n="web.ui.login.bad" hidden></p>
</section>

<div id="app" hidden>
  <header>
    <!-- One account, and this says which. Two, and it becomes the selector — a native
         <select>, so the phone opens its own picker instead of a menu we would have to
         make thumb-sized ourselves. -->
    <span id="profile" class="profile"></span>
    <select id="profile-pick" class="profile picker" hidden></select>
    <span id="link" class="link"></span>
  </header>

  <!-- THE PHONE'S COPY OF THE TAB STRIP (#1299). One light per open account, exactly
       the colours the window puts on its notebook tabs: green only when everything a
       reading can prove is proved, amber for «works in part» and for every «cannot
       tell», red for «is not playing». Tapping one looks at that account AND says, in
       words, which reading gave it that colour — a dot with no explanation leaves a
       person staring at red with no way to tell whether to fix the client or the
       daemon. Shown only with more than one account open, as the window's own strip is. -->
  <div id="profile-lights" class="lights" hidden></div>

  <main>
    <!-- what the profile is doing -->
    <section id="view-state" class="view">
      <div class="card">
        <div class="row"><span data-i18n="web.ui.game"></span><b id="game-dot" class="pill"></b></div>
        <p id="game-text" class="muted small"></p>
        <p id="game-recovery" class="muted small"></p>
        <p id="panic-mark" class="small"></p>
        <!-- WHY NOTHING IS HAPPENING — a different sentence from the mark above it
             (#1393). That one says somebody pressed «Стоп всё»; this one says the state
             it left: this profile's daemon is down, so no timer, no trigger and no
             watchdog will try anything until it is back. -->
        <p id="gate-mark" class="small"></p>
        <div id="panic-controls" class="controls"></div>
        <!-- Start it, close it, put it back. The three the window has, drawn from
             /api/state so the phone never decides for itself which of them applies. -->
        <div id="game-controls" class="controls"></div>
      </div>
      <div class="card">
        <div class="row"><span data-i18n="web.ui.daemon"></span><b id="daemon-dot" class="pill"></b></div>
        <p id="daemon-text" class="muted small"></p>
        <p id="daemon-user" class="muted small" hidden></p>
        <p id="daemon-shared" class="small bad" hidden></p>
      </div>
      <div class="card">
        <div class="row"><span data-i18n="web.ui.doing"></span><b id="busy-dot" class="pill"></b></div>
        <p id="activity" class="muted small"></p>
        <!-- …and the press that ends it (#1300), the phone's copy of the button beside
             the window's status strip. Which recipe, and the step it has reached, so the
             thumb knows what it is throwing away; the button is greyed when nothing is
             playing, here as there. -->
        <p id="interrupt-runs" class="muted small" hidden></p>
        <div id="interrupt-controls" class="row"></div>
      </div>
      <div class="card">
        <div class="row"><span data-i18n="web.ui.timers.head"></span><b id="timers-on" class="pill"></b></div>
        <p id="timers-next" class="muted small"></p>
      </div>
      <!-- The panel itself, last on the page: which version is running, and the press
           that puts it back on the code that is now on disk. The «Веб» tab has no
           screen of its own by decision (CLAUDE.md), and what such a tab needs on the
           move belongs here rather than in a page of its own. -->
      <div id="panel-card" class="card" hidden>
        <div class="row"><span data-i18n="web.ui.version"></span><b id="panel-version" class="pill"></b></div>
        <p class="muted small" data-i18n="web.ui.panel.hint"></p>
        <div id="panel-controls" class="controls"></div>
      </div>
    </section>

    <!-- the errands -->
    <section id="view-timers" class="view" hidden>
      <div id="timers-list"></div>
      <p id="timers-empty" class="muted" data-i18n="web.ui.timers.empty" hidden></p>
    </section>

    <!-- the scenarios -->
    <section id="view-actions" class="view" hidden>
      <input id="actions-filter" type="search" autocomplete="off"
             data-i18n-placeholder="web.ui.search">
      <div id="actions-list"></div>
      <p id="actions-empty" class="muted" data-i18n="web.ui.actions.none" hidden></p>
    </section>

    <!-- everything else the panel has: one list, then one generic screen -->
    <section id="view-more" class="view" hidden>
      <div id="more-list"></div>
      <p id="more-empty" class="muted" data-i18n="web.ui.more.empty" hidden></p>
    </section>

    <section id="view-screen" class="view" hidden>
      <div class="row screen-head">
        <button id="screen-back" class="back" data-i18n="web.ui.back"></button>
        <b id="screen-title"></b>
      </div>
      <input id="screen-filter" type="search" autocomplete="off" hidden
             data-i18n-placeholder="web.ui.search">
      <div id="screen-body"></div>
    </section>

    <!-- what has been said -->
    <section id="view-log" class="view" hidden>
      <label class="row switch">
        <span data-i18n="web.ui.notify"></span>
        <input id="notify" type="checkbox">
      </label>
      <div id="log-list" class="log"></div>
      <p id="log-empty" class="muted" data-i18n="web.ui.log.empty" hidden></p>
    </section>
  </main>

  <p id="offline" class="offline" data-i18n="web.ui.offline" hidden></p>
  <p id="toast" class="toast" hidden></p>

  <nav>
    <button class="nav on" data-view="state"   data-i18n="web.ui.nav.state"></button>
    <button class="nav"     data-view="timers" data-i18n="web.ui.nav.timers"></button>
    <button class="nav"     data-view="actions" data-i18n="web.ui.nav.actions"></button>
    <button class="nav"     data-view="log"    data-i18n="web.ui.nav.log"></button>
    <button class="nav"     data-view="more"   data-i18n="web.ui.nav.more"></button>
  </nav>
</div>

<script src="/app.js"></script>
</body>
</html>
